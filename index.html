<style>

.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:20px;font-size:11px;border:1px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer;white-space:nowrap;user-select:none}

.cal{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}

.cc{min-height:56px;min-width:0;overflow:hidden;padding:3px;border-right:1px solid #f3f4f6;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .1s}
.cc:hover{background:#f9fafb}.cc.sel{background:#eff6ff}.cc.today .dn{background:#2563eb;color:#fff;font-weight:700}

function findSession(fromMon,skip=0){
  let mon=fromMon, found=0

function currentDocName(doc){
  if(!doc) return ''
  if(isAttach(doc)) return doc.name
  const ev=S.events.find(e=>e.id===doc.event_id); if(!ev) return doc.name
  const ses=findSession(mondayOf(ev.date)); if(!ses||ses.mon!==mondayOf(ev.date)) return doc.name
  const slot=sessionSlots(ses).find(s=>s.leaf.id===doc.unit_id); if(!slot) return doc.name
  const leaf=getUnit(doc.unit_id)

}

// PDF 드래그&드롭: el에 파일을 떨어뜨리면 onFile(file) 호출
function acceptDrop(elm,onFile,{hoverCls='dragover'}={}){
  const stop=e=>{e.preventDefault();e.stopPropagation()}
  elm.addEventListener('dragenter',e=>{stop(e);elm.classList.add(hoverCls)})
  elm.addEventListener('dragover',e=>{stop(e);e.dataTransfer.dropEffect='copy';elm.classList.add(hoverCls)})
  elm.addEventListener('dragleave',e=>{stop(e);if(!elm.contains(e.relatedTarget))elm.classList.remove(hoverCls)})
  elm.addEventListener('drop',e=>{stop(e);elm.classList.remove(hoverCls);const f=e.dataTransfer?.files?.[0];if(!f)return
    if(!/\.pdf$/i.test(f.name)){toast('PDF 파일만 업로드할 수 있습니다','err');return} onFile(f)})
}

function sessionDocsInOrder(ses){
  const out=[]
  for(const s of sessionSlots(ses)){
    const rep_=reportDocs(s.leaf.id,s.ev.id)[0]
    if(rep_) out.push(rep_)
    for(const a of attachDocs(s.leaf.id,s.ev.id)) out.push(a)
  }
  return out
}
// 세션 제출본을 회의 순서대로 PDF 파일 하나씩 저장 (zip 없이)
async function downloadSessionPdfs(ses, _unused, onProgress){
  const docs=sessionDocsInOrder(ses)
  if(!docs.length) throw new Error('내려받을 자료가 없습니다')
  let n=0
  for(const doc of docs){
    await downloadDoc(doc); n++
    if(onProgress) onProgress(n,docs.length)
    await new Promise(r=>setTimeout(r,450))   // 브라우저가 연속 저장을 막지 않도록 간격
  }
  return n
}

// 회의 진행 순서 기준 슬롯 (상위 1..N, 비취합 하위는 "N-k")
function sessionSlots(ses){
  const slots=[]; const seen=new Set()
  for(const ev of ses.evs){
    if(ev.unit_id==='all')continue
    const root=rootOf(ev.unit_id); if(!root||seen.has(root.id))continue; seen.add(root.id)
    const n=seen.size
    if(root.merge_kids||!kidsOf(root.id).length) slots.push({leaf:root,root,ev,num:String(n)})
    else kidsOf(root.id).forEach((leaf,k)=>slots.push({leaf,root,ev,num:`${n}-${k+1}`}))
  }
  return slots
}

function autoDocName(unitId, eventId, reportType){

  const same=S.docs.filter(d=>d.unit_id===unitId&&(eventId?d.event_id===eventId:!d.event_id&&d.report_type===reportType))
  const version=Math.max(0,...same.map(d=>d.version||0))+1
  if(!ses) return {name:`(${leaf?.name||unitId}) ${TYPE_LABEL(reportType)}_v${version}.pdf`, version}

}

async function mergePdfs(docs){
  const PDFLib=await loadPdfLib(); const out=await PDFLib.PDFDocument.create()
  for(const doc of docs){
    const url=await DB.getFileUrl(doc.file_path); if(!url) throw new Error(`${doc.name} URL 생성 실패`)

// 하위 조직 제출 후: 상위가 merge_kids면 하위 전부 제출 시 상위 명의 통합본 자동 생성
async function afterChildUpload(unitId,eventId,reportType){
  const u=getUnit(unitId), parent=u?.parent_id?getUnit(u.parent_id):null
  if(!parent?.merge_kids) return null
  const kids=kidsOf(parent.id), docs=kids.map(k=>latestDoc(k.id,eventId))
  if(docs.some(d=>!d)) return null
  const pd=latestDoc(parent.id,eventId)
  if(pd&&docs.every(d=>String(d.uploaded_at)<=String(pd.uploaded_at))) return null
  toast(`${parent.name} 하위 ${kids.length}건 취합 중…`)
  const blob=await mergePdfs(docs)
  const file=new File([blob],'merged.pdf',{type:'application/pdf'})
  const doc=await DB.uploadFile(file,parent.id,reportType,eventId)
  S.docs.unshift(doc); toast(`${doc.name} 생성 완료`)
  return doc
}

// 국가번호별 자동 하이픈
function fmtPhone(code,raw){
  let d=(raw||'').replace(/\D/g,'')
  if(!d) return ''
  if(d[0]==='0') d=d.slice(1)                 // 010 → 10, 044 → 44
  const g=(...sizes)=>{const out=[];let i=0;for(const s of sizes){if(i>=d.length)break;out.push(d.slice(i,i+s));i+=s}if(i<d.length)out.push(d.slice(i));return out.join('-')}
  if(code==='+82'){                            // 한국
    if(/^1[0-9]/.test(d)) return d.length>9?g(2,4,4):g(2,3,4)      // 휴대폰·안심번호
    if(d[0]==='2')        return d.length>8?g(1,4,4):g(1,3,4)      // 서울
    return d.length>9?g(2,4,4):g(2,3,4)                            // 그 외 지역
  }
  if(code==='+81') return d.length>9?g(2,4,4):g(2,3,4)             // 일본
  if(code==='+1')  return g(3,3,4)                                 // 미국
  if(code==='+61') return d[0]==='4'?g(3,3,3):g(1,4,4)             // 호주
  if(code==='+39') return d.length>9?g(3,4,4):g(3,3,4)             // 이탈리아
  if(code==='+353')return d.length>8?g(2,4,4):g(2,3,4)             // 아일랜드
  if(code==='+44') return d.length>9?g(4,3,4):g(3,3,4)             // 영국
  if(d.length<=7) return g(3,4)
  if(d.length===8) return g(4,4)
  if(d.length===9) return g(3,3,3)
  if(d.length===10) return g(3,3,4)
  return g(3,4,4)
}

// ── Supabase API ─────────────────────────────────────────
const DB = {
  async load() {
    const [u,c,e,d,h] = await Promise.all([
      sb.from('units').select('*').order('sort_order'),
      sb.from('contacts').select('*'),
      sb.from('events').select('*').order('date').order('seq',{nullsFirst:false}).order('time'),
      sb.from('documents').select('*').order('uploaded_at',{ascending:false}),
      sb.from('holidays').select('*').order('date'),
    ])
    S.units    = orderUnits(u.data||[])
    S.contacts = c.data||[]
    S.events   = (e.data||[]).sort(cmpEv)
    S.docs     = d.data||[]
    S.holidays = h.data||[]
    purgeExpiredDocs()
    if(isAdmin()){
      const [rc,mr]=await Promise.all([sb.from('recipients').select('*').order('sort_order'), sb.from('mail_rules').select('*').order('mail_type').order('mail_no').order('sort_order')])
      S.recipients=rc.data||[]; S.mailRules=mr.data||[]
    }
    if(isAdmin()){
      const [{data},g] = await Promise.all([sb.from('profiles').select('*'), sb.from('grants').select('*').order('granted_at')])
      S.users = data||[]; S.grants = g.data||[]
    }
  },
  async uploadFile(file, unitId, reportType, eventId, kind='report') {
    const ext  = file.name.split('.').pop().toLowerCase()
    if(ext!=='pdf') throw new Error('PDF 파일만 업로드할 수 있습니다. 문서를 PDF로 내보낸 뒤 올려주세요.')
    const {name, version} = kind==='attachment'
      ? {name:file.name, version:attachDocs(unitId,eventId).length+1}      // 별첨: 원본 파일명 그대로
      : autoDocName(unitId, eventId, reportType)
    const path = `${unitId}/${Date.now()}_${Math.random().toString(36).slice(2,6)}.pdf`
    const {error:ue} = await sb.storage.from('documents').upload(path, file, {contentType:'application/pdf'})
    if(ue) throw new Error('파일 업로드 실패: ' + ue.message)
    const {data,error:de} = await sb.from('documents').insert({
      unit_id: unitId, event_id: eventId||null, report_type: reportType,
      name, orig_name: file.name, version, kind, file_type: 'pdf', file_path: path,
      size: file.size, uploaded_by: S.user.id, uploaded_by_name: S.profile?.name||'',
    }).select().single()
    if(de) throw new Error('메타데이터 저장 실패: ' + de.message)
    return data
  },
  async getFileUrl(path, downloadName) {
    const {data} = await sb.storage.from('documents').createSignedUrl(path, 60, downloadName?{download:downloadName}:undefined)
    return data?.signedUrl||null
  },
  async deleteDoc(doc) {
    await sb.storage.from('documents').remove([doc.file_path])
    await sb.from('documents').delete().eq('id', doc.id)
  },
}

          const st=statusParts(unit,ev,{merged:true}); if(st.submitted!==null){tot++; if(st.submitted)done++}
          if(st.parts._hist){const t3=nm.childNodes[1];const link=el('span',{cls:'clk',title:'클릭하면 제출 이력 확인'},unit.name);link.onclick=e=>{e.stopPropagation();openModal({type:'docHistory',data:st.parts._hist})};nm.replaceChild(link,t3)}
          const nk=kidSt.filter(k=>k.submitted).length
          if(!st.submitted){const b0=st.parts[0].firstChild; if(b0)b0.textContent=`취합 ${nk}/${kids.length}`}

        box.append(r)

      }
    })
    box.append(el('div',{cls:'sesfoot'},el('span',{},tot?`제출 ${done} / ${tot}`:'제출 대상 없음'),el('span',{cls:'fw7',style:{color:done===tot?'#059669':'#dc2626'}},!tot?'생략':done===tot?'전 사업부/법인 제출 완료':`미제출 ${tot-done}`)))
    // 전체 내려받기: 전 사업부 제출 완료 시에만 활성화
    const nFiles=sessionSlots(view).filter(s=>docsBySlot[s.leaf.id]).length
    const dlRow=el('div',{cls:'sesdl'})
    const nAll=sessionDocsInOrder(view).length
    const dlBtn=el('button',{cls:'btn btn-p'},`📄 전체 다운로드 (${nAll}건)`)

      dlRow.append(dlBtn,pvBtn,el('div',{cls:'txs tmu',style:{width:'100%'}},'전 사업부/법인 제출 완료 시 활성화'))

    box.append(dlRow)

  right.append(box)
  // 선택한 날짜 상세 — 일정·휴무가 있는 날만 (관리자는 빈 날도 열림: 일정 편집)
  if(S.selDate){
    const dEvs=S.events.filter(e=>e.date===S.selDate).sort(cmpEv), dHols=holsOn(S.selDate)

// ── 사업부 뷰 ───────────────────────────────────────────
function renderUnit(){
  const unit=S.selUnit
  const kids=kidsOf(unit.id)
  const pickables=kids.length?(unit.merge_kids?[unit,...kids]:kids):[unit]   // 취합 상위(운영)는 자신도 선택 가능
  if(!pickables.some(u=>u.id===S.selLeaf)) S.selLeaf=pickables[0].id
  const leaf=getUnit(S.selLeaf)||unit
  const ct=S.contacts.find(c=>c.unit_id===unit.id)
  const docs=[...S.docs.filter(d=>d.unit_id===leaf.id&&d.report_type===S.reportTab)].sort((a,b)=>b.uploaded_at.localeCompare(a.uploaded_at))
  const [wFrom,wTo]=monthWindow()
  const allEvs=S.events.filter(e=>(e.unit_id===unit.id||e.unit_id===leaf.id||e.unit_id==='all')&&e.type===S.reportTab&&e.date>=wFrom&&e.date<=wTo).sort((a,b)=>cmpEv(b,a))
  const frag=document.createDocumentFragment()

  const ph=el('div',{cls:'ph'})
  const titleBlock=el('div',{cls:'flex',style:{gap:'12px'}})
  titleBlock.append(el('span',{cls:'udot',style:{background:unit.color,width:'12px',height:'12px'}}),
    el('div',{},el('h2',{},unit.name)))
  ph.append(titleBlock)
  // 조직 전환 — 좁은 화면에서 사이드바 없이 이동
  if(isNarrow()){
    const opts=[]
    for(const u of topUnits().filter(u=>canOpenUnit(u.id))){
      const kids=kidsOf(u.id).filter(k=>canUp(k.id)||isAdmin())
      if(kids.length){ if(u.merge_kids)opts.push([u.id,'',u.name]); for(const k of kids) opts.push([u.id,k.id,`${u.name} › ${k.name}`]) }
      else opts.push([u.id,'',u.name])
    }
    const sel=el('select',{cls:'input unitsel'})
    for(const [uid,lid,label] of opts){
      const op=el('option',{value:uid+'|'+lid},label)
      if(uid===unit.id&&(lid===''?!kidsOf(unit.id).length||leaf.id===unit.id:lid===leaf.id)) op.selected=true
      sel.append(op)
    }
    sel.onchange=()=>{const [uid,lid]=sel.value.split('|');S.selUnit=getUnit(uid);S.selLeaf=lid||uid;S.selEventKey=null;refreshMain();window.scrollTo(0,0)}
    ph.append(sel)
  }
  frag.append(ph)
  if(ct){   // 담당자 정보 — 제목 아래 한 줄로
    const info=el('div',{cls:'unitct'})
    info.append(el('span',{cls:'nm'},`담당: ${ct.name}${ct.title?' ('+ct.title+')':''}`))
    const item=(lbl,val,href,color)=>{
      const w=el('span',{cls:'it'})
      w.append(el('span',{cls:'k'},lbl))
      if(val){const a=el('a',{cls:'v',href});a.style.color=color||'#374151';a.textContent=val;w.append(a)}
      else w.append(el('span',{cls:'v none'},'미등록'))
      return w
    }
    info.append(item('메일',ct.email,`mailto:${ct.email}`,'#2563eb'),
                item('휴대전화',ct.mobile,`tel:${(ct.mobile||'').replace(/\s/g,'')}`),
                item('사무실',ct.phone,`tel:${(ct.phone||'').replace(/\s/g,'')}`))
    frag.append(info)
  }

  const tabs=el('div',{cls:'tabs'})
  for(const [id,lbl] of [['weekly','주요사항 심층보고 (주간)'],['monthly','월간보고'],['etc','기타']]){
    const btn=el('button',{cls:`tab${S.reportTab===id?' active':''}`},lbl)
    btn.onclick=()=>{S.reportTab=id;refreshMain()}
    tabs.append(btn)
  }
  frag.append(tabs)
  if(pickables.length>1){
    const sc=el('div',{cls:'subchips'})
    for(const k of pickables.filter(k=>canView(k.id))){
      const c=el('span',{cls:'chip'+(S.selLeaf===k.id?' on':'')+(k.id===unit.id?' pchip':'')},k.name)
      c.onclick=()=>{S.selLeaf=k.id;S.selEventKey=null;refreshMain()}
      sc.append(c)
    }
    frag.append(sc)
  }

  // ── 일정 선택 → 그 일정의 자료만 추가/조회
  const evKey=`${leaf.id}|${S.reportTab}`
  if(S.selEventKey!==evKey){ S.selEventKey=evKey; S.selEvent=allEvs[0]?.id||'' }        // 조직·탭이 바뀌면 최근 일정으로
  else if(S.selEvent&&!allEvs.some(e=>e.id===S.selEvent)) S.selEvent=allEvs[0]?.id||''  // 선택 해제('')는 그대로 유지
  const evOpts=el('select',{cls:'input'})
  evOpts.append(el('option',{value:''},'-- 일정 선택 --'))
  for(const ev of allEvs){const op=el('option',{value:ev.id},`[${fmtD(ev.date)}${ev.time?' '+ev.time:''}] ${evTitleFor(ev,leaf)}`);if(S.selEvent===ev.id)op.selected=true;evOpts.append(op)}
  evOpts.onchange=()=>{S.selEvent=evOpts.value;refreshMain()}
  const selEv=allEvs.find(e=>e.id===S.selEvent)||null

  const card=el('div',{cls:'card mb16',style:{padding:'14px'}})
  card.append(el('div',{style:{fontSize:'13px',fontWeight:'700',marginBottom:'10px'}},`🗂 ${leaf.name} — ${TYPE_LABEL(S.reportTab)}`))
  card.append(el('div',{cls:'fg'},el('label',{cls:'lbl'},`일정 선택 — 이번 달·다음 달 (${fmtD(wFrom)} ~ ${fmtD(wTo)})`),evOpts))
  card.append(el('div',{cls:'txs tmu',style:{marginTop:'6px'}},`🔒 보안을 위해 제출 자료는 업로드 후 ${DOC_RETENTION_DAYS}일이 지나면 자동 삭제됩니다`))
  frag.append(card)

  if(!selEv){ frag.append(el('div',{cls:'empty'},'일정을 선택하면 해당 일정의 자료를 확인하고 제출할 수 있습니다')); return frag }

  const evDocs=reportDocs(leaf.id,selEv.id)
  const evAtts=attachDocs(leaf.id,selEv.id)
  card.append(el('div',{cls:'evsum'},
    el('span',{cls:'evsum-d'},`${fmtD(selEv.date)}${selEv.time?' '+selEv.time:''}`),
    el('span',{cls:'f1 ell'},evTitleFor(selEv,leaf)),
    el('span',{cls:'st '+(evDocs.length?'ok':'no')},evDocs.length?`제출 v${evDocs[0].version||1}`:'미제출')))

  // 좌: 보고 자료 / 우: 별첨 자료
  const cols=el('div',{cls:'unit2'})
  const colL=el('div',{cls:'ucol'}), colR=el('div',{cls:'ucol'})
  cols.append(colL,colR); frag.append(cols)

  const docRow=(doc,{attach=false}={})=>{
    const row=el('div',{cls:'row',style:{flexWrap:'wrap',gap:'8px'}})
    const info=el('div',{style:{flex:'1',overflow:'hidden',minWidth:'0'}})
    const nameRow=el('div',{})
    nameRow.append(el('span',{cls:'fw7 ts ell'},currentDocName(doc)))
    if(!attach&&doc.version&&doc.version===evDocs[0]?.version) nameRow.append(el('span',{style:{fontSize:'9px',padding:'1px 6px',borderRadius:'10px',background:'#dcfce7',color:'#16a34a',fontWeight:'700',marginLeft:'5px'}},'최신'))
    const dl_=docDaysLeft(doc); nameRow.append(el('span',{style:{fontSize:'9px',padding:'1px 6px',borderRadius:'10px',marginLeft:'5px',fontWeight:'700',background:dl_<=3?'#fef2f2':'#f3f4f6',color:dl_<=3?'#dc2626':'#6b7280'}},`${dl_}일 후 삭제`))
    info.append(nameRow,el('div',{cls:'txs tmu mt8'},`${fmtDT(doc.uploaded_at)} · ${doc.uploaded_by_name||''} · ${fmtB(doc.size||0)}`))
    const btns=el('div',{cls:'flex',style:{gap:'6px',flexShrink:'0'}})
    const viewBtn=el('button',{cls:'btn btn-sm'},'미리보기')
    viewBtn.onclick=async()=>{const url=await DB.getFileUrl(doc.file_path);if(url)window.open(url,'_blank');else toast('URL 생성 실패','err')}
    const dlBtn=el('button',{cls:'btn btn-sm'},'다운로드'); dlBtn.onclick=()=>downloadDoc(doc)
    btns.append(viewBtn,dlBtn)
    if(canUp(leaf.id)){
      const delBtn=el('button',{cls:'btn btn-d btn-sm'},'삭제')
      delBtn.onclick=async()=>{if(!confirm('삭제하시겠습니까?'))return;try{await DB.deleteDoc(doc);S.docs=S.docs.filter(d=>d.id!==doc.id);toast('삭제되었습니다.');refreshMain()}catch(e){toast(e.message,'err')}}
      btns.append(delBtn)
    }
    row.append(el('div',{cls:'ficon pdf'},'PDF'),info,btns)
    return row
  }

  // ── 왼쪽: 보고 자료
  colL.append(el('div',{cls:'uhead'},`📄 보고 자료 (${evDocs.length}건)`))
  if(canUp(leaf.id)&&selEv.mode!=='skipped'){
    const fileInput=el('input',{type:'file',accept:'.pdf,application/pdf',style:{display:'none'}})
    const dz=el('div',{cls:'dropzone'})
    const dzMain=el('div',{cls:'dz-main'},'📄 PDF 파일을 여기에 끌어다 놓으세요')
    dz.append(dzMain,el('div',{cls:'dz-sub'},'또는 클릭해서 파일 선택'),el('div',{cls:'dz-name'},`저장될 파일명: ${autoDocName(leaf.id,selEv.id,S.reportTab).name}`))
    dz.onclick=()=>{if(!S.uploading)fileInput.click()}
    const doUpload=async file=>{
      if(!/\.pdf$/i.test(file.name)){toast('PDF 파일만 업로드할 수 있습니다','err');return}
      S.uploading=true; dz.classList.add('busy'); dzMain.textContent='업로드 중…'
      try{
        const doc=await DB.uploadFile(file,leaf.id,S.reportTab,selEv.id)
        S.docs.unshift(doc); toast(`${doc.name} 업로드 완료`)
        try{await afterChildUpload(leaf.id,selEv.id,S.reportTab)}catch(e){toast('통합본 생성 실패: '+e.message,'err')}
      }catch(e){toast(e.message,'err')}
      finally{S.uploading=false;refreshMain()}
    }
    acceptDrop(dz,f=>{if(!S.uploading)doUpload(f)})
    fileInput.onchange=e=>{const f=e.target.files?.[0];if(!f)return;fileInput.value='';doUpload(f)}
    colL.append(dz,fileInput)
  }else if(selEv.mode==='skipped'){
    colL.append(el('div',{cls:'txs tmu',style:{padding:'8px 0'}},'⊘ 생략된 보고입니다 — 자료 제출이 필요하지 않습니다'))
  }
  if(!evDocs.length) colL.append(el('div',{cls:'empty',style:{padding:'20px'}},'아직 제출된 자료가 없습니다'))
  else{ const l=el('div',{cls:'ulist'}); evDocs.forEach(d=>l.append(docRow(d))); colL.append(l) }

  // ── 오른쪽: 별첨 자료
  colR.append(el('div',{cls:'uhead'},`📎 별첨 자료 (${evAtts.length}건)`))
  if(canUp(leaf.id)&&selEv.mode!=='skipped'){
    const afi=el('input',{type:'file',accept:'.pdf,application/pdf',multiple:'multiple',style:{display:'none'}})
    const adz=el('div',{cls:'dropzone'})
    const adzMain=el('div',{cls:'dz-main'},'📎 별첨 PDF를 여기에 끌어다 놓으세요')
    adz.append(adzMain,el('div',{cls:'dz-sub'},'또는 클릭해서 파일 선택 · 여러 건 가능'),el('div',{cls:'dz-name'},'파일명은 올린 그대로 저장됩니다'))
    adz.onclick=()=>{if(!S.uploading)afi.click()}
    const upA=async files=>{
      const list=[...files].filter(f=>{if(!/\.pdf$/i.test(f.name)){toast('PDF 파일만 업로드할 수 있습니다','err');return false}return true})
      if(!list.length)return
      S.uploading=true; adz.classList.add('busy'); adzMain.textContent='업로드 중…'
      try{ for(const f of list){const d=await DB.uploadFile(f,leaf.id,S.reportTab,selEv.id,'attachment');S.docs.unshift(d)} toast(`별첨 ${list.length}건 등록 완료`) }
      catch(e){toast(e.message,'err')}
      finally{S.uploading=false;refreshMain()}
    }
    acceptDrop(adz,f=>{if(!S.uploading)upA([f])})
    afi.onchange=e=>{const fs2=e.target.files;if(fs2?.length){afi.value='';upA(fs2)}}
    colR.append(adz,afi)
  }
  if(!evAtts.length) colR.append(el('div',{cls:'empty',style:{padding:'20px'}},'등록된 별첨 자료가 없습니다'))
  else{ const l=el('div',{cls:'ulist'}); evAtts.forEach(d=>l.append(docRow(d,{attach:true}))); colR.append(l) }

  return frag
}

function renderContacts(){
  const frag=document.createDocumentFragment()

  if(isAdmin()){const addBtn=el('button',{cls:'btn btn-p btn-sm'},'+ 담당자 추가');addBtn.onclick=()=>openModal({type:'addContact',data:{unit_id:S.units[0]?.id||'',name:'',title:'',email:'',phone:'',mobile:''}});ph.append(addBtn)}
  frag.append(ph)
  const grid=el('div',{cls:'ctg'})
  const visUnits=S.units.filter(u=>canView(u.id))
  for(const unit of visUnits){

      const card=el('div',{cls:'ctc',style:{borderTopColor:unit.color}})

      card.append(head)

      const links=el('div',{cls:'ctinfo'})
      const line=(lbl,val,href,color)=>{
        const r=el('div',{cls:'ctrow'})
        r.append(el('span',{cls:'k'},lbl))
        if(val){const a=el('a',{cls:'v',href});a.style.color=color||'#374151';a.textContent=val;r.append(a)}
        else r.append(el('span',{cls:'v none'},'미등록'))
        return r
      }
      links.append(line('메일',ct.email,`mailto:${ct.email}`,'#2563eb'),
                   line('휴대전화',ct.mobile,`tel:${ct.mobile}`),
                   line('사무실',ct.phone,`tel:${ct.phone}`))
      card.append(links)
      if(isAdmin()){
        const br=el('div',{style:{display:'flex',gap:'6px',marginTop:'10px',paddingTop:'9px',borderTop:'1px solid #f3f4f6'}})
        const editBtn=el('button',{cls:'btn btn-sm',style:{flex:'1'}},'수정')
        editBtn.onclick=()=>openModal({type:'editContact',data:{...ct}})
        const delBtn=el('button',{cls:'btn btn-d btn-sm',style:{flex:'1'}},'삭제')
        delBtn.onclick=async()=>{if(!confirm('삭제?'))return;await sb.from('contacts').delete().eq('id',ct.id);S.contacts=S.contacts.filter(c=>c.id!==ct.id);toast('삭제됨');refreshMain()}
        br.append(editBtn,delBtn); card.append(br)
      }
      grid.append(card)
    }
  }
  if(!grid.children.length) grid.append(el('div',{cls:'empty'},'등록된 담당자가 없습니다'))
  frag.append(grid)
  return frag
}

// ── 수신인 목록 (관리자 전용) ────────────────────────────
const RCP_STATUS={ok:'정상',check:'확인 필요',excluded:'제외'}
const GRP_ORDER=['대표','임원','담당','팀장','파트장','법인장','필수','실무진']
const mailLine=r=>r.email?(r.name&&r.name!==r.email?`${r.name} <${r.email}>`:r.email):''
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'복사되었습니다.')}catch(e){const ta=el('textarea',{});ta.value=t;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg||'복사되었습니다.')}}
function rcpFiltered(){
  const f=S.rcp, q=f.q.trim().toLowerCase()
  return S.recipients.filter(r=>
    (!f.grps.length||f.grps.includes(r.grp))&&(f.org==='전체'||r.org===f.org)&&(f.status==='전체'||r.status===f.status)&&
    (!q||[r.name,r.email,r.org,r.l1,r.l2,r.l3,r.title,r.note].some(v=>(v||'').toLowerCase().includes(q))))
}
function renderRecipients(){
  let rerender=()=>{}
  const frag=document.createDocumentFragment()
  const ph=el('div',{cls:'ph'}); ph.append(el('h2',{},'수신인 목록'))
  const hb=el('div',{style:{display:'flex',gap:'6px'}})
  if(S.rcp.tab==='list'){
    const addBtn=el('button',{cls:'btn btn-p btn-sm'},'+ 수신인 추가')
    addBtn.onclick=()=>openModal({type:'addRecipient',data:{grp:'실무진',org:'',l1:'',l2:'',l3:'',name:'',title:'',email:'',note:'',status:'ok',sort_order:(Math.max(0,...S.recipients.map(r=>r.sort_order||0))+1)}})
    const cpBtn=el('button',{cls:'btn btn-sm'},'📋 메일주소 복사')
    cpBtn.title='현재 필터 결과 중 상태가 "정상"인 수신인만 Outlook 형식으로 복사'
    cpBtn.onclick=()=>{const rows=rcpFiltered().filter(r=>r.status==='ok'&&r.email);copyText(rows.map(mailLine).join('; '),`${S.rcp.grps.length?S.rcp.grps.join('+')+' ':''}${rows.length}명 주소 복사됨 (제외·확인필요 제외)`)}
    const csvBtn=el('button',{cls:'btn btn-sm'},'⬇ CSV')
    csvBtn.onclick=()=>{
      const H=['구분','소속','1차','2차','3차','성함','직책','메일','비고','상태'],K=['grp','org','l1','l2','l3','name','title','email','note']
      const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`
      const lines=[H.map(esc).join(',')].concat(rcpFiltered().map(r=>K.map(k=>esc(r[k])).concat(esc(RCP_STATUS[r.status])).join(',')))
      const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=el('a',{href:URL.createObjectURL(blob),download:`회의체_수신인_${today().replace(/-/g,'')}.csv`});document.body.append(a);a.click();a.remove()
    }
    hb.append(cpBtn,csvBtn,addBtn)
  }
  ph.append(hb); frag.append(ph)
  const tabs=el('div',{cls:'tabs'})
  for(const [id,lbl] of [['list',`수신인 (${S.recipients.length})`],['rules','메일 발송 규칙']]){
    const b=el('button',{cls:`tab${S.rcp.tab===id?' active':''}`},lbl); b.onclick=()=>{S.rcp.tab=id;refreshMain()}; tabs.append(b)
  }
  frag.append(tabs)
  if(S.rcp.tab==='rules'){frag.append(renderMailRules());return frag}

  // 필터 (구분 칩은 다중 선택 · 클릭 시 표만 갱신)
  const fbar=el('div',{cls:'rbar'})
  const cnt=g=>S.recipients.filter(r=>r.grp===g).length
  const grps=[...GRP_ORDER.filter(g=>S.recipients.some(r=>r.grp===g)),...[...new Set(S.recipients.map(r=>r.grp))].filter(g=>!GRP_ORDER.includes(g))]
  const allChip=el('span',{cls:'chip'+(S.rcp.grps.length?'':' on')},'전체'); allChip.append(el('span',{cls:'n'},S.recipients.length))
  const chips={}
  const syncChips=()=>{allChip.classList.toggle('on',!S.rcp.grps.length);for(const g of grps)chips[g].classList.toggle('on',S.rcp.grps.includes(g))}
  allChip.onclick=()=>{S.rcp.grps=[];syncChips();rerender()}
  fbar.append(allChip)
  for(const g of grps){
    const c=el('span',{cls:'chip'+(S.rcp.grps.includes(g)?' on':'')},g); c.append(el('span',{cls:'n'},cnt(g)))
    c.onclick=()=>{const i=S.rcp.grps.indexOf(g); i>=0?S.rcp.grps.splice(i,1):S.rcp.grps.push(g); syncChips(); rerender()}
    chips[g]=c; fbar.append(c)
  }
  fbar.append(el('span',{cls:'txs tmu',style:{marginLeft:'4px'}},'※ 여러 개 선택 가능'))
  const fbar2=el('div',{cls:'rbar2'})
  const orgSel=el('select',{cls:'input'})
  for(const o of ['전체',...new Set(S.recipients.map(r=>r.org).filter(Boolean))]){const op=el('option',{value:o},o==='전체'?'소속: 전체':o);if(S.rcp.org===o)op.selected=true;orgSel.append(op)}
  orgSel.onchange=()=>{S.rcp.org=orgSel.value;rerender()}
  const stSel=el('select',{cls:'input st'})
  for(const [v,t] of [['전체','상태: 전체'],['ok','정상'],['check','확인 필요'],['excluded','제외']]){const op=el('option',{value:v},t);if(S.rcp.status===v)op.selected=true;stSel.append(op)}
  stSel.onchange=()=>{S.rcp.status=stSel.value;rerender()}
  const qIn=el('input',{cls:'input',placeholder:'이름·메일·팀 검색',value:S.rcp.q,style:{width:'220px'}})
  qIn.oninput=()=>{S.rcp.q=qIn.value;rerender()}
  const resetBtn=el('span',{cls:'chip clr'},'필터 초기화'); resetBtn.onclick=()=>{Object.assign(S.rcp,{grps:[],org:'전체',status:'전체',q:''});orgSel.value='전체';stSel.value='전체';qIn.value='';syncChips();rerender()}
  fbar2.append(orgSel,stSel,qIn,resetBtn)
  frag.append(fbar,fbar2)

  const info=el('div',{cls:'rinfo'})
  frag.append(info)
  const wrap=el('div',{cls:'rtw'}), table=el('table',{cls:'rt'})
  const cg=el('colgroup',{}); for(const w of [58,108,108,118,108,74,78,206,156,90,90]) cg.append(el('col',{style:{width:w+'px'}})); table.append(cg)
  const thead=el('thead',{}); const trh=el('tr',{})
  for(const h of ['구분','소속','1차','2차','3차','성함','직책','메일 주소','비고','상태','']) trh.append(el('th',{},h))
  thead.append(trh); table.append(thead)
  const tbody=el('tbody',{}); table.append(tbody); wrap.append(table); frag.append(wrap)
  rerender=()=>tbody.replaceChildren(...buildRows())
  const setInfo=rows=>{const sel=S.rcp.grps.length?`[${S.rcp.grps.join(' + ')}] `:'';const n=s=>rows.filter(r=>r.status===s).length
    info.replaceChildren(el('span',{cls:'fw7',style:{color:'#374151'}},`${sel}${rows.length}명 표시`),' · ',el('span',{cls:'st ok'},`정상 ${n('ok')}`),el('span',{cls:'st check'},`확인 필요 ${n('check')}`),el('span',{cls:'st excluded'},`제외 ${n('excluded')}`))}
  if(window.matchMedia('(max-width:1100px)').matches){   // 아이패드 등 좁은 화면: 표 대신 카드
    wrap.remove()
    const list=el('div',{cls:'rcards'})
    const paint=()=>{
      const rows=rcpFiltered(); setInfo(rows); list.replaceChildren()
      if(!rows.length){list.append(el('div',{cls:'empty'},'조건에 맞는 수신인이 없습니다'));return}
      for(const r of rows){
        const c=el('div',{cls:'rcard'+(r.status==='excluded'?' exc':r.status==='check'?' chk':'')})
        const top=el('div',{cls:'flex',style:{gap:'6px',flexWrap:'wrap'}})
        top.append(el('span',{cls:'fw7',style:{fontSize:'13px'}},r.name),el('span',{cls:'txs tmu'},r.title||''),
                   el('span',{cls:'rb '+r.status},RCP_STATUS[r.status]))
        c.append(top)
        c.append(el('div',{cls:'txs tmu',style:{marginTop:'3px'}},`${r.grp} · ${r.org}${r.l2&&r.l2!==r.org?' '+r.l2:''}`))
        if(r.email){const a=el('a',{cls:'em',href:`mailto:${r.email}`},r.email);a.onclick=e=>{e.preventDefault();copyText(r.email,'메일주소 복사됨')};c.append(el('div',{style:{marginTop:'3px'}},a))}
        if(r.note) c.append(el('div',{cls:'nt',style:{marginTop:'3px'}},r.note))

// 로그인한 모든 권한에서 연락처만 조회한다. 전체 프로필/권한 목록은 내려받지 않는다.
function normalizeAdminContacts(rows){
  const byEmail=new Map()
  for(const row of rows||[]){
    const email=String(row.email||'').trim().toLowerCase()
    if(!email||byEmail.has(email))continue
    byEmail.set(email,{name:String(row.name||'').trim()||email.split('@')[0],email})
  }
  return [...byEmail.values()].sort((a,b)=>a.name.localeCompare(b.name,'ko')||a.email.localeCompare(b.email))
}
async function fetchAdminContacts(){
  try{
    const {data,error}=await sb.rpc('dashboard_admin_contacts')
    if(!error&&Array.isArray(data))return {admins:normalizeAdminContacts(data),complete:true}
  }catch(e){}
  // 전용 조회 함수가 아직 없으면 기존 정책으로 허용된 연락처만 표시한다.
  try{
    const {data,error}=await sb.from('profiles').select('name,email').eq('role','admin')
    if(!error)return {admins:normalizeAdminContacts(data),complete:false}
  }catch(e){}
  return {admins:[],complete:false}
}

          const x=el('span',{cls:'x'},'✕'); x.onclick=()=>{data.atts.splice(i,1);paintA()}
          it.append(el('span',{cls:'nm3',title:f.name},f.name),el('span',{cls:'txs tmu'},fmtB(f.size)),x)
          alist.append(it)
        })
      }
      const addA=f=>{if(!/\.pdf$/i.test(f.name)){toast('PDF 파일만 업로드할 수 있습니다','err');return}data.atts.push(f);paintA()}
      ab.onclick=()=>ai.click()
      ai.onchange=()=>{[...(ai.files||[])].forEach(addA);ai.value=''}
      acceptDrop(ab,addA)
      c2.append(ab,ai,alist,el('div',{cls:'sub'},'파일명은 올린 그대로 저장됩니다 · 여러 건 등록 가능'))
      g.append(c1,c2); body.append(g)
      body.append(el('div',{cls:'txs tmu mt8'},'PPT·Word 문서는 PDF로 내보낸 뒤 올려주세요.'))
    }
    const actions=el('div',{style:{display:'flex',gap:'8px',marginTop:'20px'}})
    const cancelBtn=el('button',{cls:'btn',style:{flex:'1'}},'취소');cancelBtn.onclick=()=>overlay.remove()
    const saveBtn=el('button',{cls:'btn btn-p',style:{flex:'2',justifyContent:'center'}},'저장')
    saveBtn.onclick=async()=>{
      const t=config.type
      try{
        if(t==='addUnit'){
          if(!data.id?.trim()||!data.name?.trim()){toast('ID와 사업부명을 입력하세요','err');return}
          const{error}=await sb.from('units').insert({id:data.id.trim(),name:data.name,color:data.color||'#2563eb',sort_order:data.sort_order||99,parent_id:data.parent_id||null,merge_kids:!!data.merge_kids})
          if(error)throw error
          S.units.push({...data}); S.units.sort((a,b)=>a.sort_order-b.sort_order)
        }else if(t==='editUnit'){
          if(!data.name?.trim()){toast('사업부명을 입력하세요','err');return}
          const{error}=await sb.from('units').update({name:data.name,color:data.color,parent_id:data.parent_id||null,merge_kids:!!data.merge_kids}).eq('id',data.id)
          if(error)throw error
          S.units=S.units.map(u=>u.id===data.id?{...u,...data}:u)
        }else if(t==='addSession'){
          if(!data.date){toast('날짜를 입력하세요','err');return}
          const mode=data.mode||'meeting', type=data.type||'weekly', label=(data.week_label||'').trim()||thuLabel(mondayOf(data.date))
          const last=data._last, rows=[]
          data._order.forEach((uid,i)=>{
            const u=getUnit(uid); let date=data.date, time=null
            if(mode==='meeting'&&last){const le=last.evs.find(e=>rootOf(e.unit_id)?.id===uid); if(le){time=le.time; if(data.date2&&le.date!==last.dates[0])date=data.date2}}
            rows.push({unit_id:uid,title:`${u.name} ${TYPE_LABEL(type)}${mode==='written'?' (서면대체)':''}`,date,time,type,mode,seq:i+1,week_label:label,location:''})
          })
          const{data:ins,error}=await sb.from('events').insert(rows).select(); if(error)throw error
          S.events.push(...(ins||rows.map((r,i)=>({...r,id:'tmp'+Date.now()+i})))); S.events.sort(cmpEv); toast(`${rows.length}건 일정 생성`)
        }else if(t==='myAccount'){
          if(!data.p1&&!data.p2){overlay.remove();return}
          if(data.p1.length<6){toast('비밀번호는 6자 이상이어야 합니다','err');return}
          if(data.p1!==data.p2){toast('두 비밀번호가 일치하지 않습니다','err');return}
          const {error}=await sb.auth.updateUser({password:data.p1}); if(error)throw error
          toast('비밀번호가 변경되었습니다')
        }else if(t==='grantRole'){
          if(!data.picked?.length){toast('대상을 선택하세요','err');return}
          const unit_ids=(data.role==='uploader'||data.role==='viewer')?data.unit_ids:[]
          if((data.role==='uploader'||data.role==='viewer')&&!unit_ids.length){toast('대상 사업부/법인을 선택하세요','err');return}
          saveBtn.disabled=true; saveBtn.textContent='저장 중...'
          for(const pk of data.picked){
            const email=(pk.email||'').trim().toLowerCase()
            const rec={email,name:pk.name,role:data.role,unit_ids,recipient_id:pk.recipient_id||null,granted_by_name:S.profile?.name||'',granted_at:new Date().toISOString()}
            const{error}=await sb.from('grants').upsert(rec,{onConflict:'email'}); if(error)throw error
            S.grants=[...S.grants.filter(g=>g.email!==email),rec]
            const prof=S.users.find(u=>(u.email||'').toLowerCase()===email)
            if(prof){const{error:e2}=await sb.from('profiles').update({role:data.role,unit_ids,name:prof.name||pk.name}).eq('id',prof.id);if(e2)throw e2;S.users=S.users.map(u=>u.id===prof.id?{...u,role:data.role,unit_ids}:u)}
          }
          toast(`${data.picked.length}명 권한 부여 완료`)
        }else if(t==='inviteUser'){
          if(!data.email?.trim()||!data.name?.trim()){toast('이메일과 이름을 입력하세요','err');return}
          const{data:inv,error}=await sb.auth.admin.inviteUserByEmail(data.email,{data:{name:data.name,role:data.role,unit_ids:data.unit_ids}})
          if(error){
            toast('초대 기능은 Supabase Service Key가 필요합니다. README를 참고하세요.','err')
            return
          }
          toast('초대 이메일이 발송되었습니다.')
        }else if(t==='editProfile'){
          const{error}=await sb.from('profiles').update({name:data.name,role:data.role,unit_ids:data.unit_ids}).eq('id',data.id)
          if(error)throw error
          S.users=S.users.map(u=>u.id===data.id?{...u,...data}:u)
        }else if(t==='addContact'||t==='editContact'){
          if(!data.name?.trim()){toast('이름을 입력하세요','err');return}
          if(!data.email?.trim()||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email.trim())){toast('이메일을 정확히 입력하세요','err');return}
          if(!data.mobile?.trim()||!splitPhone(data.mobile)[1]){toast('휴대전화를 입력하세요','err');return}
          if(t==='addContact'){const{_q,...payload}=data;const{data:r,error}=await sb.from('contacts').insert(payload).select().single();if(error)throw error;S.contacts.push(r)}
          else{const{_q,...payload}=data;const{error}=await sb.from('contacts').update(payload).eq('id',data.id);if(error)throw error;S.contacts=S.contacts.map(c=>c.id===data.id?{...c,...payload}:c)}
        }else if(t==='uploadDoc'){
          const atts=data.atts||[]
          if(!data.file&&!atts.length){toast('제출할 PDF를 선택하세요','err');return}
          saveBtn.disabled=true; saveBtn.textContent='업로드 중...'
          if(data.file){
            const doc=await DB.uploadFile(data.file,data.unit_id,data.report_type,data.event_id)
            S.docs.unshift(doc); toast(`${doc.name} 제출 완료`)
            try{await afterChildUpload(data.unit_id,data.event_id,data.report_type)}catch(e){toast('통합본 생성 실패: '+e.message,'err')}
          }
          for(const f of atts){
            const ad=await DB.uploadFile(f,data.unit_id,data.report_type,data.event_id,'attachment')
            S.docs.unshift(ad)
          }
          if(atts.length) toast(`별첨 ${atts.length}건 등록 완료`)
        }else if(t==='addRecipient'||t==='editRecipient'){
          if(!data.name?.trim()||!data.org?.trim()){toast('성함과 소속을 입력하세요','err');return}
          const payload={grp:data.grp,org:data.org.trim(),l1:data.l1||data.org.trim(),l2:data.l2||data.l1||data.org.trim(),l3:data.l3||data.l2||data.l1||data.org.trim(),name:data.name.trim(),title:data.title||'',email:(data.email||'').trim(),note:data.note||'',status:data.status||'ok',updated_at:new Date().toISOString()}
          if(t==='addRecipient'){payload.sort_order=data.sort_order;const{data:r,error}=await sb.from('recipients').insert(payload).select().single();if(error)throw error;S.recipients.push(r||{...payload,id:'tmp'+Date.now()})}
          else{const{error}=await sb.from('recipients').update(payload).eq('id',data.id);if(error)throw error;S.recipients=S.recipients.map(x=>x.id===data.id?{...x,...payload}:x)}
        }else if(t==='addEvent'){
          if(!data.title?.trim()){toast('제목을 입력하세요','err');return}
          if(!data.week_label)data.week_label=thuLabel(mondayOf(data.date))
          const{data:r,error}=await sb.from('events').insert(data).select().single()
          if(error)throw error; S.events.push(r); S.events.sort(cmpEv)
        }
        toast('저장되었습니다.')
        overlay.remove(); refreshAll()
      }catch(e){toast(e.message||'저장 실패','err')}
    }
    if(config.type==='docHistory'||config.type==='askAdmin'){}   // 이력·문의 창은 × 로만 닫음
    else {actions.append(cancelBtn,saveBtn); body.append(actions)}
  }
  rebuildBody()
  overlay.append(modal); document.body.append(overlay)
}

// ── tap helper (체이닝용) ────────────────────────────────
Element.prototype.tap=function(fn){fn(this);return this}

// ── 초기화 ──────────────────────────────────────────────
;(async function init(){
  if(SUPABASE_URL.includes('YOUR_PROJECT')){
    root().innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;color:#374151"><div style="font-size:48px">⚙️</div><div style="font-size:18px;font-weight:700">설정이 필요합니다</div><div style="font-size:13px;color:#6b7280;text-align:center;max-width:400px">index.html 파일 상단의 SUPABASE_URL과 SUPABASE_KEY를<br>Supabase 프로젝트 정보로 교체하세요.<br><br>자세한 방법은 README.md를 참고하세요.</div></div>'
    return
  }
  const{data:{session}}=await sb.auth.getSession()
  if(session){
    S.user=session.user
    const{data:prof}=await sb.from('profiles').select('*').eq('id',S.user.id).single()
    S.profile=prof
    await DB.load()
  }
  render()
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_OUT'){S.user=null;S.profile=null;render()}
  })
})()
</script>
</body>
